name: Build

# Full synth of every module for PRs into main. Unit tests run in ci.yml
# (unit-gate); deployment and INT tests run in the app CodePipeline.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Python dependencies
        run: cd app/src && uv sync

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        # Yarn 4 has no signature audit; npm verifies the installed node_modules tree
        # (nodeLinker: node-modules) against registry signatures and attestations.
        run: npm audit signatures

      - name: Build project
        # 'sample' is the only stage with tracked config; no AWS credentials are
        # available here, so the config loader falls back to the sample files.
        env:
          STAGE: sample
          AWS_REGION: eu-west-1
        run: make build
