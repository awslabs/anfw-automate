[project]
name = "delete-routes"
version = "1.0.18"
description = "Lambda function to delete all routes for VPC before adding new routes"
authors = [
    { name = "Ajinkya Patil", email = "ajupatil@amazon.com" },
    { name = "Stephan Traub", email = "traubst@amazon.de" },
]
requires-python = ">=3.11"
dependencies = [
    "cfnresponse>=1.1.5,<2",
]

[dependency-groups]
test = [
    "bandit>=1.9.2,<2",
    "pip-audit>=2.10.0,<3",
    "pip-licenses>=4.5.1,<5",
    "pytest>=8.4.2,<9",
]

[tool.uv]
package = false
