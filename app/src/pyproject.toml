[project]
name = "app"
version = "2.0.2"
description = "Lambda Functions for automate rule management in AWS Network Firewall"
authors = [
    { name = "Ajinkya Patil", email = "ajupatil@amazon.com" },
    { name = "Stephan Traub", email = "traubst@amazon.com" },
]
requires-python = ">=3.11"
dependencies = [
    "aws-lambda-powertools>=2.43.1,<3",
    "aws-xray-sdk>=2.15.0,<3",
    "jsonschema>=4.25.1,<5",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32.5,<3",
]

[dependency-groups]
dev = [
    "boto3>=1.42.15,<2",
]
test = [
    "pytest>=8.4.2,<9",
    "pytest-cov>=6.0,<7",
    "hypothesis>=6.100,<7",
    "bandit>=1.9.2,<2",
    "pip-audit>=2.10.0,<3",
    "pip-licenses>=4.5.1,<5",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.build.targets.wheel]
packages = ["RuleCollect", "RuleExecute", "lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
