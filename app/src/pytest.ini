[pytest]
pythonpath =
    RuleCollect
    RuleExecute
    lib
testpaths = tests
markers =
    unit: marks tests as unit tests (fast, no AWS)
    property: marks tests as property-based tests (Hypothesis)
    integration: marks tests as integration tests (requires AWS INT account)
addopts = --cov=RuleCollect --cov=RuleExecute --cov=lib --cov-report=term-missing --cov-report=html
