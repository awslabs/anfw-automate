[pytest]
# Integration test configuration
# Default timeout per test: 60s for fast-fail during development.
# Override with: pytest --timeout=240 for full-length runs.
# The wait_until() polling inside tests has its own 240s budget;
# this outer timeout catches hangs and infra-missing scenarios faster.
timeout = 60
timeout_method = signal

markers =
    integration: marks tests as integration tests (requires AWS INT account)
    serial: marks tests for serial execution

testpaths = cases
pythonpath = ../../app/src
